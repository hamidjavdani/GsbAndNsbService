name: Test MSB Registration Response

on:
  push:
    branches:
      - feature/msb-registration-response-callback
  workflow_dispatch:

jobs:
  verify-registration-response:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\GSB.Test.Api.csproj

      - name: Build
        run: dotnet build .\GSB.Test.Api.csproj --configuration Release --no-restore

      - name: Start API
        shell: powershell
        run: |
          $env:ASPNETCORE_URLS = "http://127.0.0.1:5055"
          $env:UseInMemoryDatabase = "true"
          $env:CallbackApiKey = "test-msb-key"
          Start-Process dotnet -ArgumentList "run --project .\GSB.Test.Api.csproj --configuration Release --no-build" -RedirectStandardOutput api.out.log -RedirectStandardError api.err.log
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:5055" -UseBasicParsing -TimeoutSec 2 | Out-Null
            } catch {
              if ($_.Exception.Response) { break }
            }
            Start-Sleep -Seconds 1
          }

      - name: Call official MSB callback route
        shell: powershell
        run: |
          $headers = @{
            "X-MSB-Api-Key" = "test-msb-key"
            "Content-Type" = "application/json"
          }

          $body = @'
          {
            "organId": "14002861227",
            "status": 2,
            "owTrakingCode": "80000023800360",
            "sabtTrackingCode": "TEST-SABT-001",
            "result": {
              "code": 200,
              "msg": "TEST OK"
            }
          }
          '@

          $response = Invoke-RestMethod `
            -Method Post `
            -Uri "http://127.0.0.1:5055/made-14/registration-response/v1/create" `
            -Headers $headers `
            -Body $body

          $response | ConvertTo-Json -Depth 10

          if ($response.code -ne "200") {
            throw "Expected code 200 but got $($response.code)"
          }

          if ($response.message -ne "OK") {
            throw "Expected message OK but got $($response.message)"
          }

      - name: Show API logs on failure
        if: failure()
        shell: powershell
        run: |
          if (Test-Path api.out.log) { Get-Content api.out.log }
          if (Test-Path api.err.log) { Get-Content api.err.log }
